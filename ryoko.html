<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涼子さんへのご案内</title>
    <style>
        /* ページ全体のほんわかした設定 */
        body {
            background-color: #FFF9E6; /* 優しいクリーム色の背景 */
            color: #5C4D4D; /* 柔らかい印象のこげ茶色の文字 */
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.8; /* 行間を広めにとって読みやすく */
            margin: 0;
            padding: 20px;
        }

        /* パソコン・スマホ両対応のメイン枠 */
        .container {
            max-width: 600px; /* パソコンで見ても広がりすぎない幅 */
            margin: 0 auto; /* 中央に配置 */
            background-color: #FFFFFF; /* 枠の中は白にして文字をくっきりと */
            padding: 30px;
            border-radius: 20px; /* 角を丸くして柔らかい雰囲気に */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* ふんわりとした影 */
        }

        /* 見出しのデザイン */
        h1 {
            color: #E08B6C; /* 温かみのあるオレンジピンク系 */
            font-size: 1.4em;
            text-align: center;
            border-bottom: 2px dashed #FCDCB5; /* 点線でかわいらしく */
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h2 {
            color: #79A07E; /* 自然な優しいグリーン */
            font-size: 1.1em;
            margin-top: 30px;
            border-left: 5px solid #79A07E;
            padding-left: 10px;
        }

        /* 文章の段落 */
        p {
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* リンク（ボタン風）のデザイン */
        a.button {
            display: block;
            text-align: center;
            background-color: #E08B6C;
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px; /* ボタンも丸く */
            margin: 20px auto;
            max-width: 250px;
            transition: background-color 0.3s;
        }

        a.button:hover {
            background-color: #C77558;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>涼子さんへのご案内</h1>
        
        <p>ここに以前お伝えしたかった内容や、ご案内の文章を入れてくださいね。</p>
        <p>スマホで見てもパソコンで見ても、自動的に画面サイズに合わせて綺麗に表示されるようになっています。</p>

        <h2>必要な項目などがあれば</h2>
        <p>箇条書きなども、この枠の中に入れると綺麗にまとまります。</p>
        <ul>
            <li>項目その1</li>
            <li>項目その2</li>
            <li>項目その3</li>
        </ul>

        <!-- もしリンクボタンが必要な場合はこちらをお使いください -->
        <!-- <a href="#" class="button">確認ページへ</a> -->
    </div>

</body>
</html>
